[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "random-field-analysis"
version = "0.1.0"
description = "Open reproducibility code for the random-field slope reliability workflow."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
train = ["torch>=2.0", "scikit-learn>=1.3", "tqdm>=4.66", "openpyxl>=3.1"]
test = ["pytest>=8.0", "torch>=2.0"]

[tool.setuptools]
py-modules = ["neural", "nerual"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
